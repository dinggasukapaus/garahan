media: media

content:
  - name: homepage
    label: Halaman Depan
    type: file
    path: index.html
    format: raw
    fields: []

  - name: berita
    label: Berita & Agenda
    type: file
    path: data/berita.json
    format: json
    fields:
      - name: items
        label: Daftar Berita
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title} – {fields.date}"
        fields:
          - name: cat
            label: Kategori
            type: string
          - name: emoji
            label: Emoji
            type: string
          - name: bg
            label: Gambar / Background
            type: image
            description: Upload gambar background berita (bisa foto). Jika dibiarkan kosong, akan memakai warna/gradient default.
          - name: date
            label: Tanggal
            type: string
          - name: author
            label: Penulis
            type: string
          - name: readtime
            label: Lama Baca
            type: string
          - name: title
            label: Judul
            type: string
            required: true
          - name: excerpt
            label: Ringkasan Singkat
            type: text
          - name: body
            label: Isi Berita (HTML)
            type: rich-text
          - name: tags
            label: Tag
            type: string
            list: true

  - name: galeri
    label: Galeri Kegiatan
    type: file
    path: data/galeri.json
    format: json
    fields:
      - name: items
        label: Daftar Foto
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}"
        fields:
          - name: emoji
            label: Emoji
            type: string
          - name: bg
            label: Gambar / Background
            type: image
          - name: label
            label: Judul Foto
            type: string
          - name: desc
            label: Deskripsi Singkat
            type: text

  - name: potensi
    label: Potensi Desa
    type: file
    path: data/potensi.json
    format: json
    fields:
      - name: items
        label: Daftar Potensi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.cat} – {fields.title}"
        fields:
          - name: cat
            label: Kategori
            type: string
          - name: emoji
            label: Emoji
            type: string
          - name: bg
            label: Gambar / Background
            type: image
          - name: title
            label: Judul
            type: string
          - name: stats
            label: Statistik Ringkas
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.num} – {fields.lbl}"
            fields:
              - name: num
                label: Angka
                type: string
              - name: lbl
                label: Label
                type: string
          - name: desc
            label: Deskripsi (HTML)
            type: rich-text
          - name: produk
            label: Produk / Daya Tarik
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.icon} {fields.name}"
            fields:
              - name: icon
                label: Icon/Emoji
                type: string
              - name: name
                label: Nama
                type: string
              - name: desc
                label: Deskripsi
                type: text
          - name: tags
            label: Tag
            type: string
            list: true

  - name: layanan
    label: Layanan Administrasi
    type: file
    path: data/layanan.json
    format: json
    fields:
      - name: items
        label: Daftar Layanan
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: icon
            label: Icon/Emoji
            type: string
          - name: title
            label: Nama Layanan
            type: string
            required: true
          - name: description
            label: Deskripsi Layanan
            type: text

  - name: transparansi
    label: Transparansi Anggaran
    type: file
    path: data/transparansi.json
    format: json
    fields:
      - name: budget
        label: Informasi Anggaran
        type: object
        fields:
          - name: year
            label: Tahun Anggaran
            type: number
          - name: title
            label: Judul Anggaran
            type: string
          - name: total
            label: Total Anggaran (format text)
            type: string
          - name: totalAmount
            label: Total Anggaran (nilai angka)
            type: number
      - name: documents
        label: Dokumen Transparansi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: icon
            label: Icon
            type: string
          - name: title
            label: Nama Dokumen
            type: string
          - name: url
            label: URL Dokumen
            type: string
      - name: allocations
        label: Alokasi Anggaran
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Nama Alokasi
            type: string
          - name: percentage
            label: Persentase (%)
            type: number
          - name: amount
            label: Jumlah (Rupiah)
            type: number

  - name: settings
    label: Pengaturan Situs
    type: file
    path: data/site.json
    format: json
    fields:
      - name: villageName
        label: Nama Desa
        type: string
      - name: subdistrict
        label: Kecamatan
        type: string
      - name: regency
        label: Kabupaten/Kota
        type: string
      - name: villageHeadName
        label: Nama Kepala Desa
        type: string
      - name: villageHeadTitle
        label: Jabatan Kepala Desa
        type: string
      - name: villageHeadPeriod
        label: Periode Jabatan Kepala Desa
        type: string
      - name: villageHeadPhoto
        label: Foto Kepala Desa
        type: image
        description: Upload foto kepala desa. Foto akan tersimpan di folder media/
      - name: villagePhoto
        label: Foto Kantor Desa
        type: image
        description: Upload foto kantor/gedung desa. Foto akan tersimpan di folder media/

settings:
  content:
    merge: true

